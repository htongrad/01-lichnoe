<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личное</title>
<meta name="theme-color" content="#10482f">
<meta name="description" content="Личная панель с календарём и заметками.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png?v=2">
<link rel="apple-touch-icon" href="./icon-192.png?v=2">
<style id="personal-styles">
#personal, #personal * { box-sizing: border-box; }
#personal {
  color-scheme: light dark;
  --background: #ebf1ea;
  --paper: #ffffff;
  --text: #14271c;
  --secondary: #304639;
  --line: #c4d4c7;
  --green: #10482f;
  --tint: #d9ebd8;
  display: flex;
  flex-direction: column;
  width: min(100%, 32rem);
  margin-inline: auto;
  background: var(--background);
  color: var(--text);
  font: 1rem/1.45 system-ui, sans-serif;
  overflow-wrap: anywhere;
}
@media (prefers-color-scheme: dark) {
  #personal {
    --background: #15231b;
    --paper: #203329;
    --text: #f4fbf5;
    --secondary: #d5e7d8;
    --line: #566f5e;
    --green: #b5e8ba;
    --tint: #2d4735;
  }
}
#personal header { padding: .85rem 1rem 0; display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
#personal .brand { color: var(--green); font-weight: 750; }
#personal small { color: var(--secondary); font-size: .875em; }
#personal main { flex: 1; min-width: 0; padding: .85rem clamp(.65rem, 4vw, 1.15rem) 1.2rem; }
#personal .hero {
  background: #10482f;
  border-radius: .85rem;
  padding: 1rem;
}
#personal .hero h1, #personal .hero p { color: #fff; margin: 0; }
#personal .hero p { margin-top: .25rem; font-size: .9em; }
#personal h1 { font-size: 1.7em; line-height: 1.15; letter-spacing: -.035em; }
#personal h2 { font-size: 1em; margin: 1rem 0 .4rem; }
#personal button { font: inherit; color: inherit; border: 0; background: none; min-height: 44px; min-width: 0; cursor: pointer; }
#personal :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
#personal .events, #personal .month, #personal .record { background: var(--paper); border: 1px solid var(--line); border-radius: .8rem; }
#personal .events { padding: 0 .65rem; }
#personal .event, #personal .note { display: block; text-align: start; width: 100%; padding: .55rem 0; }
#personal .event { display: grid; grid-template-columns: minmax(3.25em, max-content) minmax(0, 1fr); gap: .45rem; align-items: start; }
#personal .event + .event { border-top: 1px solid var(--line); }
#personal .event-time { font-variant-numeric: tabular-nums; color: var(--green); }
#personal .event small, #personal .note small { display: block; }
#personal .notes { display: grid; gap: .4rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
#personal .note { border: 1px solid var(--line); border-radius: .65rem; background: var(--paper); padding: .55rem .65rem; }
#personal .note:first-child { grid-column: 1 / -1; }
#personal .month { padding: .3rem; }
#personal .month-controls { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; text-align: center; }
#personal .month-controls button { color: var(--green); font-size: 1.45em; }
#personal .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
#personal .days span { font-size: .75em; color: var(--secondary); padding-block: .4rem; }
#personal .days button { padding: 0; font-size: .85em; font-variant-numeric: tabular-nums; }
#personal .days button[aria-pressed="true"], #personal nav button[aria-current="page"] { background: var(--tint); color: var(--green); border-radius: .55rem; font-weight: 700; }
#personal .empty, #personal .record { padding: .7rem; }
#personal .empty { margin: 0; color: var(--secondary); }
#personal .record { margin-top: .7rem; }
#personal .back { color: var(--green); padding: 0 .15rem; }
#personal nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .2rem; border-top: 1px solid var(--line); background: var(--paper); padding: .35rem .45rem max(.35rem, env(safe-area-inset-bottom)); }
#personal nav button { padding: .3rem .1rem; font-size: .82em; }
@media (max-width: 359px) { #personal .notes { grid-template-columns: minmax(0, 1fr); } }
@media (forced-colors: active) { #personal .hero { border: 1px solid CanvasText; } #personal .hero h1, #personal .hero p { color: CanvasText; } }
#personal:has(.create:not([hidden])) main { padding-bottom: 4.75rem; }
#personal .bottom { position:relative; z-index:1; }
#personal .create {
  position:absolute;
  inset-inline-end:max(.85rem, env(safe-area-inset-right));
  bottom:calc(100% + .65rem);
  display:grid;
  place-items:center;
  width:3.5rem;
  height:3.5rem;
  padding:0;
  border-radius:50%;
  background:var(--green);
  color:var(--paper);
  font-size:1.9rem;
  line-height:1;
  box-shadow:0 .2rem .7rem #14271c45;
}
@media (forced-colors: active) { #personal .create { border:1px solid ButtonText; } }
#personal .action { border-radius:.6rem; padding:.4rem .7rem; background:var(--tint); color:var(--green); font-weight:700; }
#personal .primary { background:var(--green); color:var(--paper); }
#personal form { display:grid; gap:.65rem; padding-top:.7rem; }
#personal form label { display:grid; gap:.2rem; min-width:0; }
#personal form .check { display:flex; align-items:center; min-height:44px; gap:.45rem; }
#personal input:not([type=checkbox]), #personal select, #personal textarea { width:100%; min-width:0; max-width:100%; min-height:44px; font:inherit; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:.5rem; padding:.4rem; }
#personal textarea { min-height:9rem; resize:vertical; }
#personal .times { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; }
#personal [hidden] { display:none !important; }
#personal .controls { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.6rem; }
#personal .record { white-space:pre-wrap; }
#personal .notice { margin:.4rem 1rem 0; color:var(--secondary); font-size:.875em; }
#personal .notes.all { grid-template-columns:minmax(0,1fr); }
#personal .notes small { white-space:pre-line; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
#personal { --shadow: 0 2px 6px #14271c20; }
#personal .hero, #personal .events, #personal .month, #personal .record, #personal .note { box-shadow:var(--shadow); }
#personal .hero { border:1px solid #ffffff26; }
#personal .section h2 { margin:0 0 .45rem; }
#personal .empty { background:var(--paper); border:1px solid var(--line); border-radius:.7rem; }
#personal .action, #personal .month-controls button, #personal .back { border:1px solid var(--line); box-shadow:var(--shadow); }
#personal .back { border-radius:.6rem; padding-inline:.65rem; margin-bottom:.5rem; background:var(--paper); }
#personal .month-controls { gap:.25rem; padding:.25rem; }
#personal .month-controls button { border-radius:.55rem; background:var(--tint); }
#personal nav { gap:.35rem; box-shadow:0 -2px 8px #14271c17; }
#personal nav button { border:1px solid var(--line); border-radius:.65rem; }
#personal nav button[aria-current="page"] { border-color:var(--green); border-radius:.65rem; }
#personal .menu { position:relative; z-index:2; }
#personal .menu summary { display:grid; place-items:center; min-height:44px; min-width:48px; cursor:pointer; list-style:none; font-size:1.35rem; }
#personal .menu summary::-webkit-details-marker { display:none; }
#personal .menu-items { position:absolute; inset-inline-end:0; top:calc(100% + .35rem); width:min(14rem, 70vw); padding:.35rem; background:var(--paper); border:1px solid var(--line); border-radius:.7rem; box-shadow:var(--shadow); }
#personal .menu-items button { width:100%; text-align:start; padding:.45rem .55rem; border-radius:.45rem; }
#personal .menu-items button:focus-visible { background:var(--tint); }
#personal .agenda-day + .agenda-day { margin-top:.6rem; }
#personal .agenda-day h3 { margin:0 0 .25rem; color:var(--green); font-size:.87em; }
#personal .agenda-range { display:block; margin:-.2rem 0 .5rem; }
#personal .event { grid-template-columns:minmax(0, 5.25rem) minmax(0,1fr); }
#personal .brand { display:inline-flex; align-items:center; gap:.55rem; color:var(--text); }
#personal .panel-mark { display:grid; place-items:center; min-width:2.2rem; min-height:2.2rem; padding:.2rem; border-radius:.55rem; background:#10482f; color:#fff; font-weight:850; }
#personal .overview-modules { display:grid; gap:.7rem; margin-top:.8rem; grid-template-columns:repeat(2,minmax(0,1fr)); }
#personal .section { margin-block:1rem; min-width:0; background:var(--paper); border:1px solid var(--line); border-radius:.85rem; box-shadow:0 2px 0 var(--line); padding:.7rem; }
#personal .overview-modules .section { margin:0; }
#personal .notes-module { grid-column:1 / -1; }
#personal .section .events, #personal .section .month, #personal .section .empty { border:0; box-shadow:none; padding:0; }
#personal .section .agenda-day + .agenda-day { border-top:1px solid var(--line); padding-top:.55rem; }
#personal .overview-modules .event { display:flex; flex-direction:column; gap:.15rem; }
#personal .overview-modules .notes { grid-template-columns:minmax(0,1fr); }
#personal .note small { color:var(--secondary); }
#personal .days button[aria-pressed="true"],
#personal nav button[aria-current="page"],
#personal .primary,
#personal .create { background:#10482f; color:#fff; border-color:#10482f; }
#personal .controls button:not(.primary) { border:1px solid var(--line); border-radius:.6rem; padding-inline:.7rem; background:var(--paper); }
#personal #google-summary p { margin:0; }
#personal #google-summary p + button { margin-top:.55rem; }
@media (max-width: 460px) {
  #personal form .times { grid-template-columns:minmax(0,1fr); }
}

@media (max-width: 359px) { #personal .overview-modules { grid-template-columns:minmax(0,1fr); } }
@media (forced-colors: active) {
  #personal .panel-mark, #personal nav button[aria-current="page"], #personal .days button[aria-pressed="true"] {
    border:2px solid CanvasText;
  }
}
</style>
<style>
body { margin: 0; background: light-dark(#e6ebdf, #101913); color-scheme: light dark; }
#personal { min-height: 100dvh; }
#personal .bottom { position: sticky; bottom: 0; }
</style>
</head>
<body>
<div id="personal">
  <header><span class="brand"><span class="panel-mark" aria-hidden="true">01</span>Личное</span><details class="menu">
    <summary class="action" aria-label="Меню">⋯</summary>
    <div class="menu-items">
      <button type="button" data-action="google">Синхронизация Google</button>
      <button type="button" data-action="backups">Копии данных</button>
      <button type="button" data-action="install" hidden>Установить приложение</button>
    </div>
  </details></header>
  <p class="notice" role="status" hidden></p>
  <main></main>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <div class="bottom">
    <button type="button" class="create" aria-label="Создать запись" hidden>+</button>
    <nav aria-label="Разделы">
      <button type="button" data-page="overview">Обзор</button>
      <button type="button" data-page="calendar">Календарь</button>
      <button type="button" data-page="notes">Заметки</button>
    </nav>
  </div>
</div>
<script src="./google-sync.js?v=1.0.0"></script>
<script id="personal-script">
(() => {
  const root = document.getElementById('personal');
  const main = root.querySelector('main');
  const nav = root.querySelector('nav');
  const create = root.querySelector('.create');
  const notice = root.querySelector('.notice');
  const googleSync = window.lichnoeGoogle;
  function refreshSyncSummary() {
    const summary = main.querySelector('#google-summary');
    if (!summary) return;
    const content = googleSync?.overview() ?? '';
    if (summary.innerHTML !== content) summary.innerHTML = content;
    summary.hidden = !content;
  }
  const storageKey = 'lichnoe:v1';
  const menu = root.querySelector('.menu');
  const installButton = menu.querySelector('[data-action=install]');
  let installPrompt = null;
  const backupFile = root.querySelector('#backup-file');
  let candidate = null;
  let storageReadable = true;
  const labels = {overview:'Обзор', calendar:'Календарь', notes:'Заметки'};
  const repeats = {none:'Не повторяется', daily:'Каждый день', weekdays:'По будням', weekly:'Каждую неделю', monthly:'Каждый месяц', yearly:'Каждый год'};
  const fullDate = new Intl.DateTimeFormat('ru', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
  const monthName = new Intl.DateTimeFormat('ru', {month:'long', year:'numeric', timeZone:'UTC'});
  const dayMs = 86400000;
  const localNow = new Date();
  const today = key(new Date(Date.UTC(localNow.getFullYear(), localNow.getMonth(), localNow.getDate())));
  let selected = today;
  let month = today.slice(0, 7);
  let page = 'overview';
  let view = null;
  let data = {events:[], notes:[]};
  let loadedRecords = null;
  try {
    loadedRecords = localStorage.getItem(storageKey);
    if (loadedRecords) data = validate(JSON.parse(loadedRecords));
  } catch {
    storageReadable = false;
    showNotice('Не удалось прочитать записи браузера. Сохранение отключено, чтобы не перезаписать данные.');
  }

  function validate(value) {
    const records = value?.format === 'lichnoe-backup' && value.version === 1 ? value.data
      : Number.isSafeInteger(value?.revision) ? value.data : value;
    const str = value => typeof value === 'string';
    const date = value => str(value) && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
      Number.isFinite(+asDate(value)) && key(asDate(value)) === value;
    const time = value => str(value) && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
    const record = item => item && str(item.id) && item.id.length > 0 && str(item.title) && item.title.trim();
    const entry = item => item && str(item.title) && item.title.trim() && date(item.date) &&
      (item.allDay === true || (time(item.start) && time(item.end) && item.start < item.end));
    const unique = rows => new Set(rows.map(row => row.id)).size === rows.length;
    if (!Array.isArray(records?.events) || !Array.isArray(records?.notes) ||
        !records.notes.every(note => record(note) && str(note.text)) ||
        !records.events.every(event => record(event) && entry(event) && Object.hasOwn(repeats,event.repeat) &&
          ['never','date','count'].includes(event.ending) &&
          (event.ending !== 'date' || date(event.until)) &&
          (event.ending !== 'count' || (Number.isSafeInteger(event.count) && event.count > 0)) &&
          (!event.stopBefore || date(event.stopBefore)) &&
          event.exceptions && typeof event.exceptions === 'object' && !Array.isArray(event.exceptions) &&
          Object.entries(event.exceptions).every(([slot,item]) => date(slot) && (item === null || entry(item)))) ||
        !unique(records.events) || !unique(records.notes)) throw new Error('Invalid backup');
    return {events:records.events, notes:records.notes};
  }
  function downloadBackup() {
    const backup = {format:'lichnoe-backup',version:1,exportedAt:new Date().toISOString(),data};
    const url = URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)], {type:'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'lichnoe-' + today + '.json';
    root.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  backupFile.addEventListener('change', async () => {
    googleSync?.clearRestore();
    const file = backupFile.files[0];
    backupFile.value = '';
    if (!file) return;
    try {
      if (file.size > 5_000_000) throw new Error('Too large');
      candidate = validate(JSON.parse(await file.text()));
      showNotice('');
      view = {type:'backups'};
      render();
    } catch {
      candidate = null;
      showNotice('Не удалось открыть копию. Записи в браузере сохранены.');
      render();
    }
  });

  function key(date) { return date.toISOString().slice(0, 10); }
  function asDate(value) { return new Date(value + 'T00:00:00Z'); }
  function capital(text) { return text.charAt(0).toUpperCase() + text.slice(1); }
  function escape(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
  }
  function showNotice(text) { notice.textContent = text; notice.hidden = !text; }
  function save(records = data) {
    if (!storageReadable) return false;
    try {
      if (localStorage.getItem(storageKey) !== loadedRecords) {
        showNotice('Записи изменились в другом окне. Скачайте копию несохранённых изменений и откройте панель заново.');
        return false;
      }
      const serialized = JSON.stringify(records);
      localStorage.setItem(storageKey, serialized);
      loadedRecords = serialized;
    } catch {
      showNotice('Браузер не сохранил изменения. Скачайте копию до закрытия панели.');
      return false;
    }
    showNotice('');
    googleSync?.changed();
    return true;
  }
  function weekday(date) { return date.getUTCDay() >= 1 && date.getUTCDay() <= 5; }
  function ordinal(event, date) {
    if (date < event.date) return 0;
    const start = asDate(event.date);
    const day = asDate(date);
    const distance = (day - start) / dayMs;
    if (event.repeat === 'none') return distance === 0 ? 1 : 0;
    if (event.repeat === 'daily') return distance + 1;
    if (event.repeat === 'weekly') return distance % 7 === 0 ? distance / 7 + 1 : 0;
    if (event.repeat === 'weekdays') {
      if (!weekday(day)) return 0;
      const length = distance + 1;
      let count = Math.floor(length / 7) * 5;
      for (let i = 0; i < length % 7; i++) {
        if (weekday(new Date(+start + i * dayMs))) count++;
      }
      return count;
    }
    if (start.getUTCDate() !== day.getUTCDate()) return 0;
    if (event.repeat === 'yearly' && start.getUTCMonth() !== day.getUTCMonth()) return 0;
    const months = (day.getUTCFullYear() - start.getUTCFullYear()) * 12 + day.getUTCMonth() - start.getUTCMonth();
    const step = event.repeat === 'yearly' ? 12 : 1;
    let count = 0;
    for (let i = 0; i <= months; i += step) {
      if (new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, start.getUTCDate())).getUTCDate() === start.getUTCDate()) count++;
    }
    return count;
  }
  function occurs(event, date) {
    if (event.stopBefore && date >= event.stopBefore) return false;
    if (event.ending === 'date' && date > event.until) return false;
    const position = ordinal(event, date);
    return position > 0 && (event.ending !== 'count' || position <= event.count);
  }
  function occurrences(date) {
    const rows = [];
    for (const event of data.events) {
      if (occurs(event, date) && !Object.hasOwn(event.exceptions, date)) rows.push({id:event.id, slot:date, entry:event});
      for (const [slot, entry] of Object.entries(event.exceptions)) {
        if (entry?.date === date && occurs(event, slot)) rows.push({id:event.id, slot, entry});
      }
    }
    return rows.sort((a, b) => (a.entry.allDay ? '' : a.entry.start).localeCompare(b.entry.allDay ? '' : b.entry.start));
  }
  function hero(title, subtitle = '') {
    return `<div class="hero"><h1>${escape(title)}</h1>${subtitle ? `<p>${escape(subtitle)}</p>` : ''}</div>`;
  }
  function eventList(date, rows = occurrences(date)) {
    if (!rows.length) return '<p class="empty">Нет событий</p>';
    return `<div class="events">${rows.map(({id, slot, entry}) => {
      const series = data.events.find(item => item.id === id);
      const time = entry.allDay ? 'Весь день' : entry.start;
      return `<button type="button" class="event" data-event="${escape(id)}" data-slot="${slot}" data-occurrence-date="${date}">${entry.allDay ? '<span class="event-time">Весь день</span>' : `<time class="event-time" datetime="${escape(time)}">${escape(time)}</time>`}
        <span>${escape(entry.title)}${series.repeat === 'none' ? '' : `<small>${repeats[series.repeat]}</small>`}</span></button>`;
    }).join('')}</div>`;
  }
  function offsetDay(date, offset) { return key(new Date(+asDate(date) + offset * dayMs)); }
  function agenda(title, first, last, range) {
    const groups = [];
    for (let date = first; date <= last; date = offsetDay(date, 1)) {
      const rows = occurrences(date);
      if (rows.length) groups.push(`<div class="agenda-day"><h3>${capital(fullDate.format(asDate(date)))}</h3>${eventList(date, rows)}</div>`);
    }
    return `<section class="section"><h2>${title}</h2>${range ? `<small class="agenda-range">${range}</small>` : ''}
      ${groups.join('') || '<p class="empty">Нет событий</p>'}</section>`;
  }
  function weekAgenda(date) {
    const first = offsetDay(date, -((asDate(date).getUTCDay() + 6) % 7));
    const last = offsetDay(first, 6);
    const shortDate = new Intl.DateTimeFormat('ru', {day:'numeric', month:'long', timeZone:'UTC'});
    return agenda('События недели', first, last, shortDate.formatRange(asDate(first), asDate(last)));
  }
  function noteList(overview) {
    const notes = overview ? data.notes.slice(0, 3) : data.notes;
    return notes.length ? `<div class="notes${overview ? '' : ' all'}">${notes.map(note => `
      <button type="button" class="note" data-note="${escape(note.id)}"><strong>${escape(note.title)}</strong><small>${escape(note.text)}</small></button>`).join('')}</div>`
      : '<p class="empty">Нет заметок</p>';
  }
  function calendar() {
    const first = asDate(month + '-01');
    const offset = (first.getUTCDay() + 6) % 7;
    const count = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
    const dates = Array.from({length:count}, (_, index) => {
      const date = month + '-' + String(index + 1).padStart(2, '0');
      return `<button type="button" data-day="${date}" aria-pressed="${selected === date}">${index + 1}</button>`;
    }).join('');
    return `${hero('Календарь')}<section class="section"><h2>Выбрать день</h2><div class="month"><div class="month-controls">
      <button type="button" data-month="-1" aria-label="Предыдущий месяц">‹</button><strong>${capital(monthName.format(first))}</strong>
      <button type="button" data-month="1" aria-label="Следующий месяц">›</button></div>
      <div class="days">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(day => `<span>${day}</span>`).join('')}
      ${'<span aria-hidden="true"></span>'.repeat(offset)}${dates}</div></div></section>
      <section class="section"><h2>${capital(fullDate.format(asDate(selected)))}</h2>${eventList(selected)}</section>
      ${weekAgenda(selected)}
      ${agenda('События месяца', month + '-01', month + '-' + count, capital(monthName.format(first)))}`;
  }
  function optionList(values, value) {
    return Object.entries(values).map(([id,label]) => `<option value="${id}"${id === value ? ' selected' : ''}>${label}</option>`).join('');
  }
  function scopeOptions() {
    return {single:'Только это событие', following:'Это и следующие', series:'Вся серия'};
  }
  function editForm() {
    const note = page === 'notes';
    const original = view.record;
    const value = note ? original ?? {} : view.entry ?? {date:selected, start:'09:00', end:'10:00', repeat:'none', ending:'never'};
    const recurring = !note && original && original.repeat !== 'none';
    return `${hero((original ? 'Редактировать ' : note ? 'Новая ' : 'Новое ') + (note ? original ? 'заметку' : 'заметка' : 'событие'))}
      <form data-form="edit">
        ${recurring ? `<label>Применить к<select name="scope">${optionList(scopeOptions(), 'single')}</select></label>` : ''}
        <label>Название<input name="title" required maxlength="200" value="${escape(value.title)}"></label>
        ${note ? `<label>Текст<textarea name="text" rows="6">${escape(value.text)}</textarea></label>` : `
          <label>Дата<input type="date" name="date" required value="${escape(value.date)}"></label>
          <label class="check"><input type="checkbox" name="allDay"${value.allDay ? ' checked' : ''}> Весь день</label>
          <div class="times"><label>Начало<input name="start" type="time" value="${escape(value.start || '09:00')}"></label>
          <label>Окончание<input name="end" type="time" value="${escape(value.end || '10:00')}"></label></div>
          <label data-repeat>Повтор<select name="repeat">${optionList(repeats, original?.repeat ?? value.repeat)}</select></label>
          <label data-ending>Окончание серии<select name="ending">${optionList({never:'Бессрочно',date:'До даты',count:'После заданного числа повторений'}, original?.ending ?? value.ending)}</select></label>
          <label data-until>Последняя дата включительно<input name="until" type="date" value="${escape(original?.until ?? value.until)}"></label>
          <label data-count>Число событий в серии<input name="count" type="number" min="1" max="9999" value="${escape(original?.count ?? value.count ?? 10)}"></label>`}
        <div class="controls"><button type="submit" class="action primary">Сохранить</button><button type="button" data-action="cancel">Отмена</button></div>
      </form>`;
  }
  function fields(form) {
    if (page === 'notes') return;
    const get = name => form.elements.namedItem(name);
    const single = get('scope')?.value === 'single';
    const allDay = get('allDay').checked;
    const repeatsEnabled = !single && get('repeat').value !== 'none';
    const ending = get('ending').value;
    form.querySelector('.times').hidden = allDay;
    get('start').required = get('end').required = !allDay;
    form.querySelector('[data-repeat]').hidden = single;
    form.querySelector('[data-ending]').hidden = !repeatsEnabled;
    form.querySelector('[data-until]').hidden = !repeatsEnabled || ending !== 'date';
    form.querySelector('[data-count]').hidden = !repeatsEnabled || ending !== 'count';
    get('until').required = repeatsEnabled && ending === 'date';
    get('count').required = repeatsEnabled && ending === 'count';
    get('count').disabled = !get('count').required;
    get('until').disabled = !get('until').required;
  }
  function render() {
    if (view?.type === 'google') {
      main.innerHTML = hero('Синхронизация Google') + (googleSync?.html() ?? '<p>Подключение доступно после загрузки панели с интернетом.</p>');
    } else if (view?.type === 'backups') {
      main.innerHTML = `${hero('Копии данных')}
        <p>События и заметки сохраняются в этом браузере.</p>
        <div class="controls"><button type="button" class="action" data-action="export">Скачать копию</button>
        <button type="button" class="action" data-action="import">Выбрать файл</button></div>
        ${candidate ? `<p class="record">В файле: событий — ${candidate.events.length}, заметок — ${candidate.notes.length}. Записи с совпадающими идентификаторами останутся в текущей версии.</p>
        <button type="button" class="action primary" data-action="restore">Добавить записи из копии</button>` : ''}`;
    } else if (view?.type === 'edit') {
      main.innerHTML = editForm();
      fields(main.querySelector('form'));
    } else if (view?.type === 'delete') {
      const series = page === 'calendar' && view.record.repeat !== 'none';
      main.innerHTML = `${hero('Удалить ' + (page === 'notes' ? 'заметку' : 'событие') + '?')}
        <p class="record">${escape(view.entry?.title ?? view.record.title)}</p><form data-form="delete">
        ${series ? `<label>Удалить<select name="scope">${optionList(scopeOptions(), 'single')}</select></label>` : ''}
        <div class="controls"><button type="submit" class="action primary">Удалить</button><button type="button" data-action="cancel">Отмена</button></div></form>`;
    } else if (view?.type === 'record') {
      const item = view.entry ?? view.record;
      const detail = page === 'notes' ? item.text : (item.allDay ? 'Весь день' : item.start + '–' + item.end)
        + (view.record.repeat === 'none' ? '' : ' · ' + repeats[view.record.repeat]);
      main.innerHTML = `<button type="button" class="back" data-action="back">← ${labels[page]}</button>
        ${hero(item.title, page === 'calendar' ? capital(fullDate.format(asDate(item.date))) : '')}
        <p class="record">${escape(detail)}</p><div class="controls"><button type="button" class="action" data-action="edit">Изменить</button>
        <button type="button" data-action="delete">Удалить</button></div>`;
    } else if (page === 'overview') {
      main.innerHTML = `${hero('Обзор', capital(fullDate.format(asDate(today))))}
        <div id="google-summary" class="section" aria-live="polite" hidden></div>
        <div class="overview-modules">
          <section class="section today-module"><h2>Сегодня</h2>${eventList(today)}</section>
          ${weekAgenda(today)}
          <section class="section notes-module"><h2>Недавние заметки</h2>${noteList(true)}</section>
        </div>`;
    } else {
      main.innerHTML = page === 'calendar' ? calendar() : `${hero('Заметки')}<section class="section"><h2>Все заметки</h2>${noteList(false)}</section>`;
    }
    refreshSyncSummary();
    create.hidden = !storageReadable || Boolean(view) || page === 'overview';
    create.dataset.action = page === 'calendar' ? 'new-event' : 'new-note';
    create.setAttribute('aria-label', page === 'calendar' ? 'Создать событие' : 'Создать заметку');
    nav.querySelectorAll('button').forEach(button => {
      if (button.dataset.page === page) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
  }
  function finish(date) {
    if (date) { selected = date; month = date.slice(0, 7); }
    view = null;
    save();
    render();
  }
  main.addEventListener('input', event => {
    if (event.target instanceof HTMLInputElement) event.target.setCustomValidity('');
  });
  main.addEventListener('change', event => {
    const form = event.target.form;
    if (form?.dataset.form !== 'edit' || page !== 'calendar') return;
    if (event.target.name === 'scope') {
      const scope = event.target.value;
      form.elements.date.value = scope === 'series' ? view.record.date : scope === 'following' ? view.slot : view.entry.date;
      if (view.record.ending === 'count') {
        form.elements.count.value = scope === 'following'
          ? view.record.count - ordinal(view.record, view.slot) + 1
          : view.record.count;
      }
    }
    for (const name of ['end','until']) form.elements.namedItem(name).setCustomValidity('');
    fields(form);
  });
  main.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    if (form.hasAttribute('data-google-config')) { googleSync.configure(form); return; }
    if (!storageReadable) return;
    const values = new FormData(form);
    const get = name => String(values.get(name) ?? '');
    const original = view.record;
    const scope = get('scope');
    if (form.dataset.form === 'delete') {
      if (page === 'notes') data.notes = data.notes.filter(item => item.id !== original.id);
      else if (scope === 'single') original.exceptions[view.slot] = null;
      else if (scope === 'following') original.stopBefore = view.slot;
      else data.events = data.events.filter(item => item.id !== original.id);
      finish();
      return;
    }
    const title = get('title').trim();
    if (!title) {
      form.elements.title.setCustomValidity('Введите название.');
      form.elements.title.reportValidity();
      return;
    }
    if (page === 'notes') {
      data.notes = [{id:original?.id ?? crypto.randomUUID(), title, text:get('text')}, ...data.notes.filter(item => item.id !== original?.id)];
      finish();
      return;
    }
    const allDay = values.has('allDay');
    const entry = {title, date:get('date'), allDay, start:allDay ? '' : get('start'), end:allDay ? '' : get('end')};
    if (!allDay && entry.end <= entry.start) {
      form.elements.end.setCustomValidity('Окончание должно быть позже начала.');
      form.elements.end.reportValidity();
      return;
    }
    if (scope === 'single') {
      original.exceptions[view.slot] = entry;
    } else {
      const repeat = get('repeat');
      const ending = repeat === 'none' ? 'never' : get('ending');
      if (ending === 'date' && get('until') < entry.date) {
        form.elements.until.setCustomValidity('Дата окончания серии должна быть не раньше начала.');
        form.elements.until.reportValidity();
        return;
      }
      const updated = {...entry, id:original?.id ?? crypto.randomUUID(), repeat, ending, until:get('until'), count:Number(get('count')), exceptions:{}};
      if (original?.stopBefore && repeat !== 'none') updated.stopBefore = original.stopBefore;
      if (scope === 'following') {
        updated.id = crypto.randomUUID();
        for (const [slot, exception] of Object.entries(original.exceptions)) {
          if (slot >= view.slot && occurs(updated, slot)) updated.exceptions[slot] = exception;
        }
        original.stopBefore = view.slot;
        data.events.push(updated);
      } else if (original) {
        for (const [slot, exception] of Object.entries(original.exceptions)) {
          if (repeat !== 'none' && occurs(updated, slot)) updated.exceptions[slot] = exception;
        }
        data.events[data.events.indexOf(original)] = updated;
      } else {
        data.events.push(updated);
      }
    }
    finish(entry.date);
  });
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.type === 'submit') return;
    const {page:destination, month:direction, day, event:id, slot, note, action} = button.dataset;
    if (!menu.contains(button) || ['backups', 'google', 'install'].includes(action)) menu.open = false;
    if (action === 'install' && installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      installButton.hidden = true;
      prompt.prompt().catch(() => showNotice('Откройте меню Chrome, чтобы установить приложение.'));
      return;
    }
    if (button.dataset.google) { googleSync.action(button.dataset.google); return; }
    if (action === 'google') { googleSync?.open(); view = {type:'google'}; render(); return; }
    if (action === 'export') { downloadBackup(); return; }
    if (action === 'import') { backupFile.click(); return; }
    if (action === 'restore' && candidate) {
      const addMissing = (current, incoming) => {
        const ids = new Set(current.map(item => item.id));
        return [...current, ...incoming.filter(item => !ids.has(item.id))];
      };
      const merged = {events:addMissing(data.events,candidate.events), notes:addMissing(data.notes,candidate.notes)};
      if (save(merged)) {
        data = merged;
        googleSync?.restored();
        candidate = null;
        showNotice('Копия добавлена в браузер.');
      }
    } else if (action === 'backups') { googleSync?.clearRestore(); candidate = null; view = {type:'backups'}; }
    else if (!storageReadable && ['edit','delete','new-event','new-note'].includes(action)) return;
    else if (destination) { page = destination; view = null; }
    else if (direction) {
      const first = asDate(month + '-01');
      selected = key(new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + Number(direction), 1)));
      month = selected.slice(0, 7);
    } else if (day) selected = day;
    else if (id) {
      const record = data.events.find(item => item.id === id);
      const entry = record.exceptions[slot] ?? {...record, date:button.dataset.occurrenceDate};
      page = 'calendar'; selected = entry.date; month = selected.slice(0, 7);
      view = {type:'record', record, entry, slot};
    } else if (note) {
      page = 'notes'; view = {type:'record', record:data.notes.find(item => item.id === note)};
    } else if (action === 'new-event' || action === 'new-note') view = {type:'edit'};
    else if (action === 'edit' || action === 'delete') view.type = action;
    else if (action === 'cancel') view = view.record ? {...view, type:'record'} : null;
    else if (action === 'back') view = null;
    else return;
    render();
    if (action === 'new-event' || action === 'new-note') main.querySelector('h1').scrollIntoView({block:'start'});
    if (day) main.querySelector('[data-day="' + day + '"]')?.focus({preventScroll:true});
    if (direction) main.querySelector('[data-month="' + direction + '"]')?.focus({preventScroll:true});
  });
  document.addEventListener('click', event => {
    if (menu.open && !menu.contains(event.target)) menu.open = false;
  });
  menu.addEventListener('keydown', event => {
    if (event.key === 'Escape') { menu.open = false; menu.querySelector('summary').focus(); }
  });
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    installButton.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installButton.hidden = true;
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Service worker:', error));
  }
  googleSync?.init({
    records() {
      if (!storageReadable) throw new Error('Записи браузера недоступны. Синхронизация остановлена.');
      const saved = localStorage.getItem(storageKey);
      if (!saved && (data.events.length || data.notes.length)) throw new Error('Сначала сохраните записи в браузере.');
      if (saved && JSON.stringify(validate(JSON.parse(saved))) !== JSON.stringify(data)) {
        throw new Error('Записи изменились в другом окне или не были сохранены. Обновите панель.');
      }
      return data;
    },
    occurs,
    countThrough(event,date) {
      if (date < event.date) return 0;
      let slot = date;
      while (slot >= event.date) {
        const count = ordinal(event, slot);
        if (count) return count;
        slot = offsetDay(slot, -1);
      }
      return 0;
    },
    refresh() { if (view?.type === 'google') render(); else refreshSyncSummary(); },
    offerRestore(value) {
      candidate = validate(value);
      view = {type:'backups'};
      showNotice('Копия загружена с Диска. Добавьте записи из копии, чтобы сохранить их в браузере.');
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
