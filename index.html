<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Личное">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Личное</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3EF;
    --surface: #FFFFFF;
    --text: #1B211D;
    --muted: #6B766E;
    --line: #DCE1D9;
    --accent: #7E9B88;         /* пыльный зелёный */
    --accent-strong: #486A57;  /* для текста, линий и кнопок */
    --accent-soft: #E6EDE7;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 12px;
    --appbar-h: 58px;
    --tabbar-h: 60px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.solid { fill: currentColor; stroke: none; }

  /* ---------- верхняя панель ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20; height: calc(var(--appbar-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 20px 0;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(241, 243, 239, .92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .brand::before { content: ""; width: 3px; height: 18px; background: var(--accent); border-radius: 2px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer; margin-right: -8px;
  }
  .icon-btn:active { background: var(--accent-soft); }

  /* ---------- контент ---------- */
  main { padding: 20px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px); max-width: 720px; margin: 0 auto; }
  body.editing main { padding-bottom: 24px; }
  .tab { display: none; }
  .tab.active { display: block; animation: rise .22s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .text-btn { border: 0; background: transparent; color: var(--accent-strong); font-weight: 600; font-size: 13px; padding: 4px 0; cursor: pointer; }

  /* заголовок страницы (без карточки) */
  .hero { padding: 4px 2px 22px; }
  .hero .hello { color: var(--accent-strong); }
  .hero .date { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -.4px; margin: 8px 0 20px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 14px 0 14px; }
  .stat + .stat { border-left: 1px solid var(--line); padding-left: 16px; }
  .stat .v { font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--accent-strong); }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .frame { width: 100%; border: 0; display: block; border-radius: 8px; background: var(--surface); }

  /* журнал */
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { position: relative; padding: 0 0 14px 20px; font-size: 14px; font-weight: 500; }
  .log li:last-child { padding-bottom: 0; }
  .log li::before { content: ""; position: absolute; left: 1px; top: 7px; width: 7px; height: 7px; background: var(--accent); }
  .log li::after { content: ""; position: absolute; left: 4px; top: 17px; bottom: -3px; width: 1px; background: var(--line); }
  .log li:last-child::after { display: none; }
  .log small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* форма ID календаря */
  .setup { text-align: center; padding: 14px 4px; }
  .setup p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .field {
    width: 100%; padding: 13px 14px; font: inherit; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--text); margin-bottom: 10px; outline: none;
  }
  .field:focus { border-color: var(--accent-strong); }
  .btn { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--accent-strong); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .btn:active { opacity: .88; }

  /* календарь */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .seg button { border: 0; background: transparent; padding: 9px 0; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--accent-strong); color: #fff; }
  .cal-card { padding: 0; overflow: hidden; margin-bottom: 0;
    height: calc(100vh - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    height: calc(100dvh - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 420px; }
  .cal-card .frame { height: 100%; border-radius: 0; }
  .cal-card .setup { padding-top: 40px; }

  /* заметки */
  .notes-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 2px 14px; }
  .notes-head h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: -.3px; line-height: 1.1; }
  .pill { border: 1px solid var(--accent-strong); color: var(--accent-strong); background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pill:active { background: var(--accent-soft); }
  .pill svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .note-list { padding: 0; overflow: hidden; }
  .note-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; cursor: pointer; }
  .note-item:last-child { border-bottom: 0; }
  .note-item:active { background: var(--bg); }
  .note-item .t { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-item .p { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .note-item .d { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .note-item.compact { padding: 11px 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .note-item.compact .t { flex: 1; min-width: 0; font-weight: 500; }
  .note-item.compact .d { margin: 0; flex: none; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  #noteEditor { display: none; }
  body.editing #noteListView { display: none; }
  body.editing #noteEditor { display: block; }
  .ed-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px 10px; }
  .ed-bar button { border: 0; background: transparent; color: var(--accent-strong); font-weight: 600; font-size: 14px; padding: 8px 6px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 8px; }
  .ed-bar button.danger { color: var(--muted); }
  .ed-bar button.danger.armed { color: #A4423B; }
  .ed-bar button:active { background: var(--accent-soft); }
  .ed-bar svg.i { width: 20px; height: 20px; }
  #noteText {
    display: block; width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
    padding: 16px; font: inherit; font-size: 17px; line-height: 1.6; color: var(--text); resize: none; outline: none;
    height: calc(100vh - 170px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    height: calc(100dvh - 170px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 240px;
  }
  #noteText:focus { border-color: var(--accent); }

  /* нижнее меню */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(241, 243, 239, .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  body.editing .tabbar { display: none; }
  .tabbar button {
    position: relative; height: var(--tabbar-h); border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em;
  }
  .tabbar button.on { color: var(--accent-strong); }
  .tabbar button.on::before { content: ""; position: absolute; top: -1px; left: 32%; right: 32%; height: 2px; background: var(--accent-strong); }

  /* шторка */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(20, 30, 24, .34); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 720px; margin: 0 auto;
    background: var(--surface); border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 16px);
    transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .grab { width: 36px; height: 3px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
  .sheet .label { margin: 0 0 4px; }
  .sheet .label.gap { margin-top: 18px; }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; text-align: left; text-decoration: none; color: var(--text); font-weight: 500; font-size: 15px; cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row svg.i { color: var(--accent-strong); }
  .row small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .row .arrow { margin-left: auto; color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 10px);
    background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.editing .toast { bottom: 24px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">Личное</div>
  <button class="icon-btn" id="menuBtn" aria-label="Ссылки и настройки">
    <svg class="i solid" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
  </button>
</header>

<main>

  <!-- ОБЗОР -->
  <section class="tab active" id="tab-overview">

    <div class="hero">
      <div class="label hello" id="hello">Здравствуйте</div>
      <div class="date" id="today">&nbsp;</div>
      <div class="stats">
        <div class="stat"><div class="v" id="tileLast">—</div><div class="l">последнее обновление</div></div>
        <div class="stat"><div class="v" id="tileCount">—</div><div class="l">обновлений за 30 дней</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Ближайшие события</span></div>
      <div class="calSlot" data-mode="AGENDA" data-nav="0" data-height="300"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Заметки</span><button class="text-btn" id="allNotes">Все</button></div>
      <div id="recentNotes"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Файлы</span></div>
      <iframe class="frame" id="driveFrame" height="260" title="Файлы"></iframe>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Журнал изменений</span></div>
      <ul class="log" id="log"><li class="muted">Загрузка…</li></ul>
    </div>

  </section>

  <!-- КАЛЕНДАРЬ -->
  <section class="tab" id="tab-calendar">
    <div class="seg" id="seg">
      <button data-mode="AGENDA">Список</button>
      <button data-mode="WEEK">Неделя</button>
      <button data-mode="MONTH">Месяц</button>
    </div>
    <div class="card cal-card"><div class="calSlot" id="bigCal" data-mode="MONTH" data-nav="1" style="height:100%"></div></div>
  </section>

  <!-- ЗАМЕТКИ -->
  <section class="tab" id="tab-notes">
    <div id="noteListView">
      <div class="notes-head">
        <h2>Заметки</h2>
        <button class="pill" id="newNote"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Новая</button>
      </div>
      <div class="card note-list" id="noteList"></div>
    </div>
    <div id="noteEditor">
      <div class="ed-bar">
        <button id="edBack"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Заметки</button>
        <button class="danger" id="edDel"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg><span id="edDelText">Удалить</span></button>
      </div>
      <textarea id="noteText" placeholder="Начните писать…" aria-label="Текст заметки"></textarea>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button class="on" data-tab="overview">
    <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Обзор
  </button>
  <button data-tab="calendar">
    <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Календарь
  </button>
  <button data-tab="notes">
    <svg class="i" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>Заметки
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- шторка со ссылками -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ссылки и настройки">
  <div class="grab"></div>
  <div class="label">Открыть</div>
  <a class="row" id="linkDrive" target="_blank" rel="noopener">
    <svg class="i" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
    <span>Папка на Диске<small>01 Личное</small></span><span class="arrow">↗</span>
  </a>
  <a class="row" id="linkCal" target="_blank" rel="noopener">
    <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Google Календарь<small>полная версия</small></span><span class="arrow">↗</span>
  </a>
  <a class="row" id="linkGit" target="_blank" rel="noopener">
    <svg class="i solid" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.58 9.58 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
    <span>GitHub<small>репозиторий 01-lichnoe</small></span><span class="arrow">↗</span>
  </a>
  <div class="label gap">Настройки</div>
  <button class="row" id="copyNotes">
    <svg class="i" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>
    <span>Копировать все заметки<small>для резервной копии</small></span>
  </button>
  <div id="resetWrap">
    <button class="row" id="resetCal">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>
      <span>Сменить календарь<small>ввести другой ID</small></span>
    </button>
  </div>
</div>

<script>
// ===== НАСТРОЙКИ ПАНЕЛИ (меняются только здесь) =====
var CONFIG = {
  githubUser: "htongrad",
  githubRepo: "01-lichnoe",
  driveFolderId: "188zha7cSRoGIz5X5UNqEIH0_aOqjMs71",
  calendarId: "",            // пусто = ID вводится один раз на телефоне и хранится только в нём
  timezone: "Europe/Moscow",
  eventColor: "#486A57"
};
// =====================================================

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) {}
  return null;
}
function getCalendarId() { return CONFIG.calendarId || store("calendarId") || ""; }

var toastTimer;
function toast(text) {
  var t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
}

/* ---------- приветствие и дата ---------- */
(function () {
  var h = new Date().getHours();
  document.getElementById("hello").textContent =
    h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  var d = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("today").textContent = d.charAt(0).toUpperCase() + d.slice(1);
})();

/* ---------- календарь ---------- */
function calendarUrl(id, mode, nav) {
  return "https://calendar.google.com/calendar/embed?src=" + encodeURIComponent(id) +
    "&color=" + encodeURIComponent(CONFIG.eventColor) +
    "&bgcolor=%23ffffff&ctz=" + encodeURIComponent(CONFIG.timezone) +
    "&mode=" + mode + "&wkst=2&hl=ru" +
    "&showTitle=0&showPrint=0&showTz=0&showCalendars=0&showTabs=0" +
    "&showNav=" + nav + "&showDate=" + nav;
}

function setupForm() {
  var box = document.createElement("div");
  box.className = "setup";
  box.innerHTML = "<p>Вставьте ID календаря. Для основного календаря это адрес вашей почты Google. Он сохранится только на этом телефоне.</p>";
  var input = document.createElement("input");
  input.className = "field"; input.type = "text"; input.placeholder = "ID календаря";
  input.autocapitalize = "off"; input.autocomplete = "off";
  var btn = document.createElement("button");
  btn.className = "btn"; btn.textContent = "Сохранить";
  btn.onclick = function () {
    var v = input.value.trim();
    if (!v) return;
    store("calendarId", v);
    buildCalendars(); setLinks();
  };
  box.appendChild(input); box.appendChild(btn);
  return box;
}

function buildCalendars() {
  var id = getCalendarId();
  var slots = document.querySelectorAll(".calSlot");
  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i];
    slot.innerHTML = "";
    if (!id) { slot.appendChild(setupForm()); continue; }
    var f = document.createElement("iframe");
    f.className = "frame"; f.title = "Календарь";
    f.src = calendarUrl(id, slot.getAttribute("data-mode"), slot.getAttribute("data-nav"));
    var h = slot.getAttribute("data-height");
    if (h) f.height = h; else f.style.height = "100%";
    slot.appendChild(f);
  }
  document.getElementById("resetWrap").style.display = (CONFIG.calendarId || !id) ? "none" : "";
}

function setupSegment() {
  var seg = document.getElementById("seg"), big = document.getElementById("bigCal");
  var saved = store("calMode");
  if (saved === "MONTH" || saved === "WEEK" || saved === "AGENDA") big.setAttribute("data-mode", saved);
  function mark() {
    var m = big.getAttribute("data-mode"), b = seg.querySelectorAll("button");
    for (var i = 0; i < b.length; i++) b[i].classList.toggle("on", b[i].getAttribute("data-mode") === m);
  }
  seg.onclick = function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    big.setAttribute("data-mode", t.getAttribute("data-mode"));
    store("calMode", t.getAttribute("data-mode"));
    mark(); buildCalendars();
  };
  mark();
}

/* ---------- ссылки ---------- */
function setLinks() {
  document.getElementById("linkDrive").href = "https://drive.google.com/drive/folders/" + CONFIG.driveFolderId;
  document.getElementById("linkGit").href = "https://github.com/" + CONFIG.githubUser + "/" + CONFIG.githubRepo;
  var id = getCalendarId();
  document.getElementById("linkCal").href = id
    ? "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(id)
    : "https://calendar.google.com/calendar/r";
}

/* ---------- файлы ---------- */
function loadDrive() {
  document.getElementById("driveFrame").src =
    "https://drive.google.com/embeddedfolderview?id=" + CONFIG.driveFolderId + "#list";
}

/* ---------- журнал изменений ---------- */
function plural(n, f) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
function ago(date) {
  var s = (Date.now() - date.getTime()) / 1000;
  if (s < 60) return "только что";
  var m = Math.floor(s / 60);
  if (m < 60) return m + " " + plural(m, ["минуту", "минуты", "минут"]) + " назад";
  var h = Math.floor(m / 60);
  if (h < 24) return h + " " + plural(h, ["час", "часа", "часов"]) + " назад";
  var d = Math.floor(h / 24);
  return d + " " + plural(d, ["день", "дня", "дней"]) + " назад";
}

function loadCommits() {
  var log = document.getElementById("log");
  var url = "https://api.github.com/repos/" + CONFIG.githubUser + "/" + CONFIG.githubRepo + "/commits?per_page=30";
  fetch(url)
    .then(function (r) {
      if (r.status === 409) return [];
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (list) {
      if (!list.length) { log.innerHTML = '<li class="muted">Пока нет изменений.</li>'; return; }
      var monthAgo = Date.now() - 30 * 86400000, n = 0;
      list.forEach(function (c) { if (new Date(c.commit.author.date).getTime() > monthAgo) n++; });
      document.getElementById("tileLast").textContent = ago(new Date(list[0].commit.author.date));
      document.getElementById("tileCount").textContent = n;
      log.innerHTML = "";
      list.slice(0, 5).forEach(function (c) {
        var li = document.createElement("li");
        li.textContent = (c.commit.message || "").split("\n")[0];
        var s = document.createElement("small");
        s.textContent = ago(new Date(c.commit.author.date));
        li.appendChild(s);
        log.appendChild(li);
      });
    })
    .catch(function () { log.innerHTML = '<li class="muted">Не удалось загрузить журнал.</li>'; });
}

/* ---------- заметки ---------- */
var notes = [], currentId = null, saveTimer = null, saveWarned = false, delTimer = null, delArmed = false;

function loadNotes() {
  try {
    var raw = store("notes");
    notes = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(notes)) notes = [];
  } catch (e) { notes = []; }
}
function saveNotes() {
  try {
    localStorage.setItem("notes", JSON.stringify(notes));
  } catch (e) {
    if (!saveWarned) { saveWarned = true; toast("Не удалось сохранить заметки в браузере"); }
  }
}
function flushSave() { clearTimeout(saveTimer); saveTimer = null; if (currentId) saveNotes(); }
function noteById(id) { for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i]; return null; }
function sortedNotes() { return notes.slice().sort(function (a, b) { return b.updated - a.updated; }); }

function noteTitle(t) {
  var lines = t.split("\n");
  for (var i = 0; i < lines.length; i++) if (lines[i].trim()) return lines[i].trim();
  return "Без названия";
}
function noteBody(t) {
  var lines = t.split("\n"), seen = false, out = [];
  for (var i = 0; i < lines.length; i++) {
    if (!seen) { if (lines[i].trim()) seen = true; continue; }
    out.push(lines[i]);
  }
  return out.join(" ").replace(/\s+/g, " ").trim();
}
function fmtDate(ts) {
  var d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}
function txt(tag, cls, text) { var e = document.createElement(tag); e.className = cls; e.textContent = text; return e; }

function renderNotes() {
  var list = document.getElementById("noteList"), recent = document.getElementById("recentNotes");
  var all = sortedNotes();
  list.innerHTML = ""; recent.innerHTML = "";

  if (!all.length) {
    list.appendChild(txt("div", "empty", "Заметок пока нет. Нажмите «Новая»."));
    var e = txt("div", "muted", "Пока пусто. ");
    var b = txt("button", "text-btn", "Создать заметку");
    b.onclick = newNote; e.appendChild(b);
    recent.appendChild(e);
    return;
  }
  all.forEach(function (n) {
    var b = document.createElement("button");
    b.className = "note-item";
    b.appendChild(txt("div", "t", noteTitle(n.text)));
    var p = noteBody(n.text);
    if (p) b.appendChild(txt("div", "p", p));
    b.appendChild(txt("div", "d", fmtDate(n.updated)));
    b.onclick = function () { openNote(n.id); };
    list.appendChild(b);
  });
  all.slice(0, 3).forEach(function (n) {
    var b = document.createElement("button");
    b.className = "note-item compact";
    b.appendChild(txt("div", "t", noteTitle(n.text)));
    b.appendChild(txt("div", "d", fmtDate(n.updated)));
    b.onclick = function () { showTab("notes"); openNote(n.id); };
    recent.appendChild(b);
  });
}

function resetDeleteButton() {
  delArmed = false; clearTimeout(delTimer);
  var b = document.getElementById("edDel");
  b.classList.remove("armed");
  document.getElementById("edDelText").textContent = "Удалить";
}
function openNote(id) {
  var n = noteById(id);
  if (!n) return;
  currentId = id;
  resetDeleteButton();
  document.body.classList.add("editing");
  var ta = document.getElementById("noteText");
  ta.value = n.text;
  window.scrollTo(0, 0);
  if (!n.text) ta.focus();
}
function closeNote() {
  if (!currentId) return;
  clearTimeout(saveTimer);
  var n = noteById(currentId);
  if (n && !n.text.trim()) notes.splice(notes.indexOf(n), 1);
  saveNotes();
  currentId = null;
  resetDeleteButton();
  document.body.classList.remove("editing");
  renderNotes();
  window.scrollTo(0, 0);
}
function newNote() {
  var n = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: "", updated: Date.now() };
  notes.push(n);
  showTab("notes");
  openNote(n.id);
}
function deleteNote() {
  if (!delArmed) {
    delArmed = true;
    var b = document.getElementById("edDel");
    b.classList.add("armed");
    document.getElementById("edDelText").textContent = "Точно удалить?";
    delTimer = setTimeout(resetDeleteButton, 3000);
    return;
  }
  var n = noteById(currentId);
  if (n) notes.splice(notes.indexOf(n), 1);
  saveNotes();
  currentId = null;
  resetDeleteButton();
  document.body.classList.remove("editing");
  renderNotes();
  toast("Заметка удалена");
}
function copyText(t) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    toast(ok ? "Скопировано" : "Не удалось скопировать");
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(function () { toast("Скопировано"); }, fallback);
  } else fallback();
}
function copyAllNotes() {
  var all = sortedNotes().filter(function (n) { return n.text.trim(); });
  if (!all.length) { toast("Заметок нет"); return; }
  var parts = all.map(function (n) {
    return new Date(n.updated).toLocaleString("ru-RU", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) + "\n" + n.text;
  });
  copyText(parts.join("\n\n————————————\n\n"));
}
function setupNotes() {
  loadNotes();
  var ta = document.getElementById("noteText");
  ta.addEventListener("input", function () {
    var n = noteById(currentId);
    if (!n) return;
    n.text = ta.value; n.updated = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNotes, 250);
  });
  document.getElementById("newNote").onclick = newNote;
  document.getElementById("edBack").onclick = closeNote;
  document.getElementById("edDel").onclick = deleteNote;
  document.getElementById("allNotes").onclick = function () { showTab("notes"); };
  window.addEventListener("pagehide", flushSave);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });
  renderNotes();
}

/* ---------- вкладки ---------- */
function showTab(name) {
  if (name !== "notes" && currentId) closeNote();
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle("active", tabs[i].id === "tab-" + name);
  var btns = document.querySelectorAll(".tabbar button");
  for (var j = 0; j < btns.length; j++) btns[j].classList.toggle("on", btns[j].getAttribute("data-tab") === name);
  store("tab", name);
  window.scrollTo(0, 0);
}
function setupTabs() {
  var btns = document.querySelectorAll(".tabbar button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () { showTab(this.getAttribute("data-tab")); };
  }
  var saved = store("tab");
  if (saved === "calendar" || saved === "overview" || saved === "notes") showTab(saved);
}

/* ---------- шторка ---------- */
function setupSheet() {
  var sheet = document.getElementById("sheet"), back = document.getElementById("backdrop");
  function open(v) { sheet.classList.toggle("open", v); back.classList.toggle("open", v); }
  document.getElementById("menuBtn").onclick = function () { open(true); };
  back.onclick = function () { open(false); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") open(false); });
  document.getElementById("resetCal").onclick = function () {
    store("calendarId", null);
    open(false); buildCalendars(); setLinks();
  };
  document.getElementById("copyNotes").onclick = function () { open(false); copyAllNotes(); };
}

setupNotes();
setupTabs();
setupSegment();
setupSheet();
setLinks();
buildCalendars();
loadDrive();
loadCommits();
</script>
